name: engineering_store
description: A Flutter mobile app for engineering store inventory management (Firebase-backed)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=2.18.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  firebase_core: ^2.24.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.6.0
  firebase_app_check: ^0.2.0
  http: ^1.2.0
  google_sign_in: ^6.3.0
  excel: ^4.0.0
  intl: ^0.19.0
  image_picker: ^1.0.0
  image: ^4.1.0
  path_provider: ^2.1.0
  rxdart: ^0.27.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/company_logo_1.jpeg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/company_logo_1.jpeg"
